
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook Login</title>
    <link rel="stylesheet" href="stylesheet1.css">
</head>

<body>

    <!-- Main Container -->
    <main class="outer-part">

        <!-- Left Side: Facebook Introduction -->
        <section class="intro">
            <h1 class="logo">facebook</h1>

            <p>
                Facebook helps you connect and share
                with the people in your life.
            </p>
        </section>

        <!-- Right Side: Login Card -->
        <section class="login-section">

            <div class="login">

                <h2>Log in to Facebook</h2>

                <!-- Email -->
                <label for="email">Email address or phone number</label>
                <input
                    type="text"
                    id="email"
                    placeholder="Email address or phone number"
                    autocomplete="username"
                >

                <!-- Password -->
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <!-- Login Button -->
                   <a href="https://www.facebook.com/campaign/landing.php?campaign_id=1653377901&extra_1=s|c|318307045126|e|facebook%27|&placement=&creative=318307045126&keyword=facebook%27&partner_id=googlesem&extra_2=campaignid%3D1653377901%26adgroupid%3D65139789042%26matchtype%3De%26network%3Dg%26source%3Dnotmobile%26search_or_content%3Ds%26device%3Dc%26devicemodel%3D%26adposition%3D%26target%3D%26targetid%3Dkwd-362360550869%26loc_physical_ms%3D1011082%26loc_interest_ms%3D%26feeditemid%3D%26param1%3D%26param2%3D&gad_source=1&gad_campaignid=1653377901&gbraid=0AAAAAD2MkOV6A17L8DLq4hOPHUMTNhOdt&gclid=CjwKCAjwoaLWBhAWEiwAnyitu6oCcIG4q3bSHAfPtl4WMcHHcHaOuQ29Q5xvicufmDK5wFMK9QvWOxoC4gEQAvD_BwE"><button>Log In</button></a>


                <!-- Password Reset -->
                <p class="help-text">Problem logging in?</p>

                <a href="#" class="reset-link">
                    Reset Your Password
                </a>

                <hr>

                <!-- Create Account -->
                <p class="new-user">New to Facebook?</p>

                <a href="index2.html" class="create-link">
                    Create New Account
                </a>

            </div>

            <!-- Create Page -->
            <p class="page-text">
                <a href="index2.html">Create a Page</a>
                for a celebrity, band or business.
            </p>

        </section>

    </main>

</body>
</html>
